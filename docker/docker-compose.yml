services:
  postgres:
    image: postgres:16
    container_name: sniffnet_shared_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodlaac
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: sniff_cw_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
